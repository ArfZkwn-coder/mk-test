site_name: "Kopi Guide"
site_description: "Brewing notes"
site_url: "https://arfzkwn-coder.github.io/mk-test/"
repo_url: "https://github.com/ArfZkwn-coder/mk-test"

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

# The menu is built from the docs/ folder. To order it by hand, add a nav: list here.
